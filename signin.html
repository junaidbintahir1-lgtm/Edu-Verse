<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>EduVerse — Sign in</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Sign-in now lives inside index.html. This page only forwards old links and email links there. -->
<script>
var h=location.hash||"",next=new URLSearchParams(location.search).get("next")||"";
/* the owner dashboard sends people here with ?next=<page>.html : come back to it after signing in */
var page=/^[A-Za-z0-9._-]+\.html$/.test(next)?next:"";
try{if(page){if(localStorage.getItem("ev_auth_token")){location.replace(page);throw 0;}sessionStorage.setItem("ev_after_signin_url",page);}}catch(e){}
if(!(page&&localStorage.getItem("ev_auth_token")))location.replace("index.html"+(/access_token|error=/.test(h)?h:"#signin"));
</script>
<noscript><meta http-equiv="refresh" content="0; url=index.html#signin"></noscript>
</head><body style="background:#000;color:#eceee8;font-family:system-ui,sans-serif;padding:24px"><a href="index.html#signin" style="color:#f0b429">Continue to EduVerse</a></body></html>
